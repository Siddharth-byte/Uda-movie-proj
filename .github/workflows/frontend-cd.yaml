name: Frontend Continuous Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'starter/frontend/**'
      - 'starter/frontend/k8s/**'
      - '.github/workflows/frontend-cd.yaml'

  workflow_dispatch:

jobs:

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --watchAll=false --passWithNoTests


  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Get backend LoadBalancer URL
        id: backend
        run: |
          echo "Waiting for backend LoadBalancer..."

          for i in {1..30}; do
            BACKEND_HOST=$(kubectl get service backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$BACKEND_HOST" ]; then
              echo "Backend LoadBalancer: $BACKEND_HOST"
              echo "url=http://$BACKEND_HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Backend LoadBalancer not ready yet..."
            sleep 10
          done

          echo "ERROR: Backend LoadBalancer hostname was not created."
          kubectl get service backend
          exit 1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ steps.backend.outputs.url }}
        run: |
          echo "Building frontend with backend URL:"
          echo "$REACT_APP_MOVIE_API_URL"

          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            starter/frontend

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy frontend to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/frontend/k8s

          kustomize edit set image \
            frontend="$ECR_REGISTRY/frontend:$IMAGE_TAG"

          kustomize build . | kubectl apply -f -

      - name: Verify frontend deployment
        run: |
         if ! kubectl rollout status deployment/frontend --timeout=180s; then
         echo "===== FRONTEND DEPLOYMENT ====="
         kubectl get deployment frontend -o wide

         echo "===== FRONTEND PODS ====="
         kubectl get pods -l app=frontend -o wide

          echo "===== FRONTEND POD DESCRIBE ====="
          POD=$(kubectl get pods -l app=frontend -o jsonpath='{.items[0].metadata.name}')
          kubectl describe pod "$POD"

          echo "===== FRONTEND POD LOGS ====="
          kubectl logs "$POD" --all-containers=true --tail=200 || true

          echo "===== FRONTEND PREVIOUS LOGS ====="
          kubectl logs "$POD" --all-containers=true --previous --tail=200 || true

         exit 1
         fi

      - name: Show frontend service
        run: |
          kubectl get service frontend
