name: Backend Continuous Deployment

on:
  push:
    branches:
      - master
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

jobs:

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test


  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build backend Docker image
        working-directory: starter/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


      - name: Push backend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}


      - name: Deploy backend to EKS
        working-directory: starter/backend/k8s
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize edit set image backend=$ECR_REGISTRY/backend:$IMAGE_TAG

          echo "=== Applying backend Kubernetes manifests ==="
          kustomize build | kubectl apply -f -

          echo "=== Backend deployment ==="
          kubectl get deployment backend -o wide

          echo "=== Backend pods ==="
          kubectl get pods -l app=backend -o wide


      - name: Wait for old backend pods to terminate
        run: |
          echo "Waiting for old backend pods to terminate..."

          kubectl wait \
            --for=delete \
            pod \
            -l app=backend \
            --timeout=60s || true


      - name: Wait for backend deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s


      - name: Final backend verification
        if: always()
        run: |
          echo "======================================"
          echo "BACKEND DEPLOYMENT"
          echo "======================================"
          kubectl get deployment backend -o wide

          echo "======================================"
          echo "BACKEND REPLICASETS"
          echo "======================================"
          kubectl get replicasets -l app=backend -o wide

          echo "======================================"
          echo "BACKEND PODS"
          echo "======================================"
          kubectl get pods -l app=backend -o wide

          echo "======================================"
          echo "BACKEND SERVICES"
          echo "======================================"
          kubectl get services -l app=backend

          echo "======================================"
          echo "RECENT EVENTS"
          echo "======================================"
          kubectl get events --sort-by=.lastTimestamp | tail -30

          echo "======================================"
          echo "BACKEND LOGS"
          echo "======================================"
          kubectl logs -l app=backend \
            --tail=100 \
            --all-containers=true \
            --ignore-errors=true || true
