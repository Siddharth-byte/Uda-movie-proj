apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      terminationGracePeriodSeconds: 0

      containers:
        - name: backend
          image: backend
          ports:
            - containerPort: 5000
